<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NotePaint</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #17181c;
    --panel: #202228;
    --panel2: #292b32;
    --border: #363941;

    --text: #f1f1f3;
    --muted: #9699a3;

    --accent: #7c6cff;
    --accent2: #9387ff;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);
}

button,
input,
textarea {
    font-family: inherit;
}

.app {
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    height: 58px;

    display: flex;
    align-items: center;

    padding: 0 18px;
    gap: 16px;

    background: var(--panel);

    border-bottom:
        1px solid var(--border);

    flex-shrink: 0;
}

.logo {
    display: flex;
    align-items: center;

    gap: 10px;

    font-size: 18px;
    font-weight: 700;

    min-width: 150px;
}

.logo-icon {
    width: 32px;
    height: 32px;

    display: grid;
    place-items: center;

    border-radius: 9px;

    background: var(--accent);

    color: white;

    font-size: 17px;
}

.title-input {
    flex: 1;

    max-width: 500px;

    background: transparent;

    border: none;
    outline: none;

    color: var(--text);

    font-size: 16px;
    font-weight: 600;
}

.title-input::placeholder {
    color: #777a84;
}

.save-status {
    margin-left: auto;

    color: var(--muted);

    font-size: 13px;

    display: flex;
    align-items: center;

    gap: 7px;

    white-space: nowrap;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #58d68d;

    box-shadow:
        0 0 8px rgba(88,214,141,.5);
}


/* =========================================================
   MAIN
========================================================= */

.main {
    flex: 1;

    display: flex;

    min-height: 0;
}


/* =========================================================
   LEFT TOOLBAR
========================================================= */

.toolbar {
    width: 74px;

    background: var(--panel);

    border-right:
        1px solid var(--border);

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 12px 9px;

    gap: 7px;

    flex-shrink: 0;
}

.tool {
    width: 50px;
    height: 50px;

    border:
        1px solid transparent;

    background: transparent;

    color: #b8bac2;

    border-radius: 12px;

    cursor: pointer;

    font-size: 20px;

    transition: .15s;

    display: flex;
    align-items: center;
    justify-content: center;
}

.tool:hover {
    background: var(--panel2);

    color: white;
}

.tool.active {
    background:
        rgba(124,108,255,.18);

    color: var(--accent2);

    border-color:
        rgba(124,108,255,.3);
}

.separator {
    width: 42px;
    height: 1px;

    background: var(--border);

    margin: 5px 0;
}

.tool-bottom {
    margin-top: auto;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;

    background: #111216;
}

.paint-toolbar {
    height: 58px;

    background: var(--panel);

    border-bottom:
        1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 0 14px;

    gap: 12px;

    flex-shrink: 0;
}

.group {
    display: flex;
    align-items: center;

    gap: 7px;

    padding-right: 12px;

    border-right:
        1px solid var(--border);
}

.group:last-child {
    border: none;
}

.mini-btn {
    height: 36px;

    min-width: 36px;

    padding: 0 10px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    background: var(--panel2);

    color: #d5d6dc;

    cursor: pointer;

    font-size: 14px;
}

.mini-btn:hover {
    background: #333640;
}

.color {
    width: 30px;
    height: 30px;

    border-radius: 50%;

    border:
        2px solid #555861;

    cursor: pointer;

    overflow: hidden;
}

.color input {
    opacity: 0;

    width: 100%;
    height: 100%;

    cursor: pointer;
}

.size-label {
    color: var(--muted);

    font-size: 12px;

    white-space: nowrap;
}

#size {
    width: 100px;

    accent-color:
        var(--accent);
}

.canvas-area {
    flex: 1;

    min-height: 0;

    position: relative;

    overflow: auto;

    padding: 28px;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    background:
        radial-gradient(
            circle at 1px 1px,
            #25272d 1px,
            transparent 1px
        );

    background-size: 22px 22px;
}

.canvas-wrapper {
    position: relative;

    background: white;

    box-shadow:
        0 12px 45px rgba(0,0,0,.35);

    border-radius: 3px;

    overflow: hidden;

    flex-shrink: 0;
}

canvas {
    display: block;

    background: white;

    cursor: crosshair;
}


/* =========================================================
   NOTES
========================================================= */

.notes {
    width: 340px;

    background: var(--panel);

    border-left:
        1px solid var(--border);

    display: flex;

    flex-direction: column;

    flex-shrink: 0;
}

.notes-header {
    height: 58px;

    display: flex;
    align-items: center;

    padding: 0 16px;

    border-bottom:
        1px solid var(--border);

    font-weight: 700;
}

.notes-header span {
    color: var(--muted);

    font-size: 12px;

    margin-left: auto;

    font-weight: 400;
}

textarea {
    flex: 1;

    width: 100%;

    resize: none;

    border: none;

    outline: none;

    background: #1c1d22;

    color: #e8e8eb;

    padding: 20px;

    font-size: 15px;

    line-height: 1.7;
}

textarea::placeholder {
    color: #666973;
}

.notes-footer {
    padding: 11px 15px;

    border-top:
        1px solid var(--border);

    color: var(--muted);

    font-size: 11px;

    display: flex;

    justify-content: space-between;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.65);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 10000;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 420px;

    background: var(--panel);

    border:
        1px solid var(--border);

    border-radius: 16px;

    padding: 22px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.5);
}

.modal-box h2 {
    margin: 0 0 15px;

    font-size: 18px;
}

.modal-box p {
    color: var(--muted);

    font-size: 13px;

    line-height: 1.5;
}

.modal-actions {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 20px;
}


/* =========================================================
   PLUGIN CONTAINER
========================================================= */

#plugin-container {
    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 9000;
}

#plugin-container > * {
    pointer-events: auto;
}


@media (max-width: 900px) {

    .notes {
        width: 280px;
    }

}

@media (max-width: 700px) {

    .notes {
        display: none;
    }

    .logo {
        min-width: auto;
    }

    .logo span {
        display: none;
    }

}

</style>

</head>

<div id="plugin-container"></div>

<script>

/* ============================================================
   NOTEPAINT CORE
============================================================ */


const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const notes =
    document.getElementById("notes");

const title =
    document.getElementById("title");


const colorInput =
    document.getElementById("color");

const colorPreview =
    document.getElementById("colorPreview");


const sizeInput =
    document.getElementById("size");

const sizeValue =
    document.getElementById("sizeValue");


const saveStatus =
    document.getElementById("saveStatus");

const wordCount =
    document.getElementById("wordCount");


let tool = "brush";

let drawing = false;

let startX = 0;
let startY = 0;


let undoStack = [];
let redoStack = [];


/* ============================================================
   EVENTS
============================================================ */


const EventBus = {

    events: {},


    on(name, callback) {

        if (!this.events[name]) {
            this.events[name] = [];
        }

        this.events[name].push(callback);

    },


    emit(name, data) {

        if (!this.events[name]) {
            return;
        }

        for (const callback of this.events[name]) {

            try {
                callback(data);
            }
            catch (error) {
                console.error(error);
            }

        }

    }

};


/* ============================================================
   CANVAS
============================================================ */


function setupCanvas() {

    ctx.globalCompositeOperation =
        "source-over";

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


setupCanvas();


function saveCanvasState() {

    undoStack.push(
        canvas.toDataURL()
    );


    if (undoStack.length > 40) {

        undoStack.shift();

    }


    redoStack = [];

}


function restoreState(data) {

    const image =
        new Image();


    image.onload = () => {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            image,
            0,
            0
        );

    };


    image.src = data;

}


/* ============================================================
   MOUSE POSITION
============================================================ */


function getMousePosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (event.clientX - rect.left)
            *
            (canvas.width / rect.width),

        y:
            (event.clientY - rect.top)
            *
            (canvas.height / rect.height)

    };

}


/* ============================================================
   DRAWING
============================================================ */


canvas.addEventListener(
    "mousedown",
    event => {

        saveCanvasState();

        drawing = true;


        const position =
            getMousePosition(event);


        startX =
            position.x;

        startY =
            position.y;


        ctx.beginPath();

        ctx.moveTo(
            startX,
            startY
        );


        if (
            tool === "brush" ||
            tool === "eraser"
        ) {

            drawPoint(
                position.x,
                position.y
            );

        }

    }
);


canvas.addEventListener(
    "mousemove",
    event => {

        if (!drawing) {
            return;
        }


        const position =
            getMousePosition(event);


        if (
            tool === "brush" ||
            tool === "eraser"
        ) {

            drawPoint(
                position.x,
                position.y
            );

        }

    }
);


canvas.addEventListener(
    "mouseup",
    event => {

        if (!drawing) {
            return;
        }


        drawing = false;


        const position =
            getMousePosition(event);


        if (tool === "line") {

            drawLine(
                startX,
                startY,
                position.x,
                position.y
            );

        }


        if (tool === "rectangle") {

            drawRectangle(
                startX,
                startY,
                position.x,
                position.y
            );

        }


        if (tool === "circle") {

            drawCircle(
                startX,
                startY,
                position.x,
                position.y
            );

        }


        ctx.closePath();


        markChanged();


        EventBus.emit(
            "draw",
            {
                tool
            }
        );

    }
);


canvas.addEventListener(
    "mouseleave",
    () => {

        drawing = false;

    }
);


/* ============================================================
   BRUSH
============================================================ */


function prepareBrush() {

    ctx.lineWidth =
        Number(sizeInput.value);


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";


    if (tool === "eraser") {

        ctx.globalCompositeOperation =
            "destination-out";

    }
    else {

        ctx.globalCompositeOperation =
            "source-over";


        ctx.strokeStyle =
            colorInput.value;


        ctx.fillStyle =
            colorInput.value;

    }

}


function drawPoint(x, y) {

    prepareBrush();


    ctx.lineTo(
        x,
        y
    );


    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

}


function drawLine(
    x1,
    y1,
    x2,
    y2
) {

    prepareBrush();


    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.stroke();


    ctx.beginPath();

}


function drawRectangle(
    x1,
    y1,
    x2,
    y2
) {

    prepareBrush();


    ctx.beginPath();


    ctx.rect(
        x1,
        y1,
        x2 - x1,
        y2 - y1
    );


    ctx.stroke();


    ctx.beginPath();

}


function drawCircle(
    x1,
    y1,
    x2,
    y2
) {

    prepareBrush();


    const dx =
        x2 - x1;

    const dy =
        y2 - y1;


    const radius =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    ctx.beginPath();


    ctx.arc(
        x1,
        y1,
        radius,
        0,
        Math.PI * 2
    );


    ctx.stroke();


    ctx.beginPath();

}


/* ============================================================
   TOOLS
============================================================ */


function selectTool(toolName) {

    tool =
        toolName;


    document
        .querySelectorAll(
            ".tool[data-tool]"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    const button =
        document.querySelector(
            `[data-tool="${toolName}"]`
        );


    if (button) {

        button.classList.add(
            "active"
        );

    }


    canvas.style.cursor =
        toolName === "eraser"
            ? "cell"
            : "crosshair";


    EventBus.emit(
        "toolChanged",
        toolName
    );

}


document
    .querySelectorAll(
        ".tool[data-tool]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    selectTool(
                        button.dataset.tool
                    );

                }
            );

        }
    );


/* ============================================================
   COLORS
============================================================ */


colorInput.addEventListener(
    "input",
    () => {

        colorPreview.style.background =
            colorInput.value;


        if (tool === "eraser") {

            selectTool("brush");

        }

        markChanged();

    }
);


document
    .querySelectorAll(".preset")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    colorInput.value =
                        button.dataset.color;


                    colorPreview.style.background =
                        colorInput.value;


                    selectTool("brush");

                    markChanged();

                }
            );

        }
    );


/* ============================================================
   SIZE
============================================================ */


sizeInput.addEventListener(
    "input",
    () => {

        sizeValue.textContent =
            sizeInput.value + " px";


        EventBus.emit(
            "brushSizeChanged",
            Number(sizeInput.value)
        );

        markChanged();

    }
);


/* ============================================================
   UNDO
============================================================ */


function undo() {

    if (undoStack.length === 0) {
        return;
    }


    redoStack.push(
        canvas.toDataURL()
    );


    const state =
        undoStack.pop();


    restoreState(state);


    markChanged();


    EventBus.emit(
        "undo"
    );

}


document
    .getElementById("undo")
    .addEventListener(
        "click",
        undo
    );


/* ============================================================
   REDO
============================================================ */


function redo() {

    if (redoStack.length === 0) {
        return;
    }


    undoStack.push(
        canvas.toDataURL()
    );


    const state =
        redoStack.pop();


    restoreState(state);


    markChanged();


    EventBus.emit(
        "redo"
    );

}


document
    .getElementById("redo")
    .addEventListener(
        "click",
        redo
    );


/* ============================================================
   CLEAR
============================================================ */


const modal =
    document.getElementById(
        "confirmModal"
    );


document
    .getElementById("clear")
    .addEventListener(
        "click",
        () => {

            modal.classList.add(
                "show"
            );

        }
    );


document
    .getElementById("cancelClear")
    .addEventListener(
        "click",
        () => {

            modal.classList.remove(
                "show"
            );

        }
    );


document
    .getElementById("confirmClear")
    .addEventListener(
        "click",
        clearCanvas
    );


function clearCanvas() {

    saveCanvasState();


    ctx.globalCompositeOperation =
        "source-over";


    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    modal.classList.remove(
        "show"
    );


    markChanged();


    EventBus.emit(
        "clear"
    );

}


/* ============================================================
   NEW CANVAS
============================================================ */


document
    .getElementById("newCanvas")
    .addEventListener(
        "click",
        () => {

            saveCanvasState();


            ctx.globalCompositeOperation =
                "source-over";


            ctx.fillStyle =
                "#ffffff";


            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            markChanged();


            EventBus.emit(
                "newCanvas"
            );

        }
    );


/* ============================================================
   DOWNLOAD
============================================================ */


function downloadImage() {

    const link =
        document.createElement("a");


    link.download =
        (
            title.value.trim() ||
            "notepaint"
        ) + ".png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();


    EventBus.emit(
        "download"
    );

}


document
    .getElementById("download")
    .addEventListener(
        "click",
        downloadImage
    );


/* ============================================================
   WORD COUNT
============================================================ */


notes.addEventListener(
    "input",
    () => {

        updateWordCount();

        markChanged();

        EventBus.emit(
            "notesChanged",
            notes.value
        );

    }
);


function updateWordCount() {

    const text =
        notes.value.trim();


    const count =
        text.length === 0
            ? 0
            : text.split(/\s+/).length;


    wordCount.textContent =
        count +
        (
            count === 1
                ? " слово"
                : " слов"
        );

}


title.addEventListener(
    "input",
    () => {

        markChanged();

        EventBus.emit(
            "titleChanged",
            title.value
        );

    }
);


/* ============================================================
   STORAGE
============================================================ */


function markChanged() {

    saveStatus.textContent =
        "Есть несохранённые изменения";

}


function saveAll() {

    const data = {

        title:
            title.value,

        notes:
            notes.value,

        canvas:
            canvas.toDataURL(
                "image/png"
            ),

        savedAt:
            Date.now()

    };


    try {

        localStorage.setItem(
            "notepaint_data",
            JSON.stringify(data)
        );


        saveStatus.textContent =
            "Сохранено";


        EventBus.emit(
            "save",
            data
        );

    }
    catch (error) {

        saveStatus.textContent =
            "Ошибка сохранения";


        console.error(
            "[NotePaint]",
            error
        );

    }

}


/*
    АВТОСОХРАНЕНИЕ КАЖДЫЕ 5 СЕКУНД
*/

setInterval(
    saveAll,
    5000
);


/* ============================================================
   LOAD
============================================================ */


function loadAll() {

    const saved =
        localStorage.getItem(
            "notepaint_data"
        );


    if (!saved) {
        return;
    }


    try {

        const data =
            JSON.parse(saved);


        title.value =
            data.title || "";


        notes.value =
            data.notes || "";


        if (data.canvas) {

            restoreState(
                data.canvas
            );

        }


        updateWordCount();


        saveStatus.textContent =
            "Восстановлено";

    }
    catch (error) {

        console.error(
            "[NotePaint]",
            error
        );

    }

}


loadAll();


/* ============================================================
   NOTEPAINT API
============================================================ */


window.NotePaint = {

    version: "1.0.0",


    canvas: {

        getCanvas() {
            return canvas;
        },

        getContext() {
            return ctx;
        },

        clear() {
            clearCanvas();
        },

        saveState() {
            saveCanvasState();
        },

        undo() {
            undo();
        },

        redo() {
            redo();
        },

        download() {
            downloadImage();
        }

    },


    notes: {

        get() {
            return notes.value;
        },

        set(value) {
            notes.value = value;
            updateWordCount();
            markChanged();
        }

    },


    title: {

        get() {
            return title.value;
        },

        set(value) {
            title.value = value;
            markChanged();
        }

    },


    tools: {

        getCurrent() {
            return tool;
        },

        select(name) {
            selectTool(name);
        }

    },


    brush: {

        getColor() {
            return colorInput.value;
        },

        setColor(color) {

            colorInput.value =
                color;

            colorPreview.style.background =
                color;

        },


        getSize() {
            return Number(
                sizeInput.value
            );
        },

        setSize(size) {

            sizeInput.value =
                size;

            sizeValue.textContent =
                size + " px";

        }

    },


    storage: {

        save() {
            saveAll();
        }

    },


    events: {

        on(name, callback) {
            EventBus.on(
                name,
                callback
            );
        }

    },


    ui: {

        getPluginContainer() {

            return document.getElementById(
                "plugin-container"
            );

        }

    }

};


/* ============================================================
   PLUGIN MANAGER
============================================================ */


const PluginManager = {

    plugins: [],


    async loadAll() {

        try {

            const response =
                await fetch(
                    "plugins/plugins.json"
                );


            if (!response.ok) {

                throw new Error(
                    "plugins.json не найден"
                );

            }


            const list =
                await response.json();


            console.log(
                "[NotePaint] Плагинов:",
                list.length
            );


            for (
                const pluginPath
                of list
            ) {

                await this.load(
                    pluginPath
                );

            }

        }
        catch (error) {

            console.warn(
                "[NotePaint] Plugin Manager:",
                error.message
            );

        }

    },


    async load(path) {

        try {

            const response =
                await fetch(
                    "plugins/" + path
                );


            if (!response.ok) {

                throw new Error(
                    "Не удалось загрузить " +
                    path
                );

            }


            const html =
                await response.text();


            const parser =
                new DOMParser();


            const document =
                parser.parseFromString(
                    html,
                    "text/html"
                );


            /*
             * CSS плагина
             */

            document
                .querySelectorAll(
                    "style"
                )
                .forEach(
                    style => {

                        const newStyle =
                            document.createElement(
                                "style"
                            );

                        newStyle.textContent =
                            style.textContent;

                        document.head.appendChild(
                            newStyle
                        );

                    }
                );


            /*
             * HTML плагина
             */

            const container =
                document.getElementById(
                    "plugin"
                );


            if (container) {

                document
                    .getElementById(
                        "plugin-container"
                    )
                    .appendChild(
                        container
                    );

            }


            /*
             * JavaScript плагина
             */

            const scripts =
                document.querySelectorAll(
                    "script"
                );


            for (
                const oldScript
                of scripts
            ) {

                const script =
                    document.createElement(
                        "script"
                    );


                script.textContent =
                    oldScript.textContent;


                document.body.appendChild(
                    script
                );

            }


            this.plugins.push(
                path
            );


            console.log(
                "[NotePaint] Загружен:",
                path
            );

        }
        catch (error) {

            console.error(
                "[NotePaint] Ошибка плагина:",
                path,
                error
            );

        }

    }

};


PluginManager.loadAll();


/* ============================================================
   GLOBAL KEYBOARD EVENT
============================================================ */

window.addEventListener(
    "keydown",
    event => {

        EventBus.emit(
            "keydown",
            event
        );

    },
    true
);


/* ============================================================
   INITIAL
============================================================ */

colorPreview.style.background =
    colorInput.value;


</script>
