    <div id="np-pro-tools">

        <div class="np-tools-title">

        <div class="np-tools-subtitle">

                <button id="np-zoom-in">
                    +

                <button id="np-zoom-reset">
                    100
                </button>

            <div class="np-zoom-help">
                CTRL + колесо мыши
            </div>

        </div>

    </div>
</div>

<script>
(() => {

    /*
     * ==========================================================
     * NOTEPAINT PRO TOOLS
     * ==========================================================
     */

    const api = window.NotePaint;

    if (!api) {

        console.error(
            "[Pro Tools] NotePaint API не найдена"
        );

        return;

    }


    const canvas =
        api.canvas.getCanvas();

    const ctx =
        api.canvas.getContext();


    if (!canvas || !ctx) {

        console.error(
            "[Pro Tools] Canvas не найден"
        );

        return;

    }


    const root =
        document.getElementById(
            "np-pro-tools"
        );


    const buttons =
        root.querySelectorAll(
            ".np-tool"
        );


    const sizeInput =
        document.getElementById(
            "np-size"
        );


    const sizeValue =
        document.getElementById(
            "np-size-value"
        );


    const zoomIn =
        document.getElementById(
            "np-zoom-in"
        );


    const zoomOut =
        document.getElementById(
            "np-zoom-out"
        );


    const zoomReset =
        document.getElementById(
            "np-zoom-reset"
        );


    const zoomValue =
        document.getElementById(
            "np-zoom-value"
        );


    /*
     * ----------------------------------------------------------
     * СОСТОЯНИЕ
     * ----------------------------------------------------------
     */

    let currentTool =
        "pencil";

    let drawing =
        false;

    let startX =
        0;

    let startY =
        0;

    let lastX =
        0;

    let lastY =
        0;

    let snapshot =
        null;

    let brushSize =
        4;


    /*
     * ----------------------------------------------------------
     * ВЫБОР ИНСТРУМЕНТА
     * ----------------------------------------------------------
     */

    function selectTool(name) {

        currentTool =
            name;

        buttons.forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.tool === name
                );

            }
        );

        /*
         * Если основной NotePaint знает
         * такой инструмент — переключаем и его.
         */

        try {

            api.tools.select(
                name
            );

        }
        catch (_) {
            // Игнорируем,
            // если инструмент отсутствует.
        }

    }


    buttons.forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    selectTool(
                        button.dataset.tool
                    );

                }
            );

        }
    );


    /*
     * ----------------------------------------------------------
     * РАЗМЕР
     * ----------------------------------------------------------
     */

    sizeInput.addEventListener(
        "input",
        () => {

            brushSize =
                Number(
                    sizeInput.value
                );

            sizeValue.textContent =
                `${brushSize} px`;

            try {

                api.brush.setSize(
                    brushSize
                );

            }
            catch (_) {}

        }
    );


    /*
     * ----------------------------------------------------------
     * КООРДИНАТЫ CANVAS
     * ----------------------------------------------------------
     */

    function getPosition(event) {

        const rect =
            canvas.getBoundingClientRect();

        return {

            x:
                (
                    event.clientX
                    - rect.left
                )
                *
                (
                    canvas.width
                    /
                    rect.width
                ),

            y:
                (
                    event.clientY
                    - rect.top
                )
                *
                (
                    canvas.height
                    /
                    rect.height
                )

        };

    }


    /*
     * ----------------------------------------------------------
     * SNAPSHOT
     * ----------------------------------------------------------
     */

    function makeSnapshot() {

        snapshot =
            ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );

    }


    function restoreSnapshot() {

        if (!snapshot)
            return;

        ctx.putImageData(
            snapshot,
            0,
            0
        );

    }


    /*
     * ----------------------------------------------------------
     * ЦВЕТ
     * ----------------------------------------------------------
     */

    function getColor() {

        try {

            return api.brush.getColor();

        }
        catch (_) {

            return "#000000";

        }

    }


    /*
     * ----------------------------------------------------------
     * СТИЛИ РИСОВАНИЯ
     * ----------------------------------------------------------
     */

    function beginStroke() {

        ctx.beginPath();

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.lineWidth =
            brushSize;

        ctx.strokeStyle =
            getColor();

        ctx.fillStyle =
            getColor();

    }


    /*
     * ----------------------------------------------------------
     * DRAW
     * ----------------------------------------------------------
     */

    function drawFreehand(
        x,
        y
    ) {

        ctx.lineTo(
            x,
            y
        );

        ctx.stroke();

    }


    function drawLine(
        x1,
        y1,
        x2,
        y2
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y1
        );

        ctx.lineTo(
            x2,
            y2
        );

        ctx.stroke();

    }


    function drawRect(
        x1,
        y1,
        x2,
        y2
    ) {

        const width =
            x2 - x1;

        const height =
            y2 - y1;

        ctx.strokeRect(
            x1,
            y1,
            width,
            height
        );

    }


    function drawEllipse(
        x1,
        y1,
        x2,
        y2
    ) {

        const cx =
            (x1 + x2) / 2;

        const cy =
            (y1 + y2) / 2;

        const rx =
            Math.abs(
                x2 - x1
            ) / 2;

        const ry =
            Math.abs(
                y2 - y1
            ) / 2;

        ctx.beginPath();

        ctx.ellipse(
            cx,
            cy,
            rx,
            ry,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    /*
     * ----------------------------------------------------------
     * POINTER DOWN
     * ----------------------------------------------------------
     */

    canvas.addEventListener(
        "pointerdown",
        event => {

            /*
             * Для инструментов,
             * которые принадлежат этому плагину.
             */

            const custom =
                [
                    "pencil",
                    "brush",
                    "eraser",
                    "line",
                    "rect",
                    "ellipse",
                    "picker"
                ];

            if (
                !custom.includes(
                    currentTool
                )
            ) {

                return;

            }


            const pos =
                getPosition(
                    event
                );


            drawing =
                true;


            startX =
                pos.x;

            startY =
                pos.y;

            lastX =
                pos.x;

            lastY =
                pos.y;


            makeSnapshot();


            beginStroke();


            if (
                currentTool ===
                "pencil"
                ||
                currentTool ===
                "brush"
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    pos.x,
                    pos.y
                );

                ctx.stroke();

            }


            canvas.setPointerCapture(
                event.pointerId
            );

            event.preventDefault();

        },
        true
    );


    /*
     * ----------------------------------------------------------
     * POINTER MOVE
     * ----------------------------------------------------------
     */

    canvas.addEventListener(
        "pointermove",
        event => {

            if (!drawing)
                return;


            const pos =
                getPosition(
                    event
                );


            /*
             * Карандаш / кисть
             */

            if (
                currentTool ===
                "pencil"
                ||
                currentTool ===
                "brush"
            ) {

                drawFreehand(
                    pos.x,
                    pos.y
                );

            }


            /*
             * Ластик
             */

            if (
                currentTool ===
                "eraser"
            ) {

                ctx.save();

                ctx.globalCompositeOperation =
                    "destination-out";

                ctx.lineWidth =
                    brushSize * 2;

                ctx.lineCap =
                    "round";

                ctx.beginPath();

                ctx.moveTo(
                    lastX,
                    lastY
                );

                ctx.lineTo(
                    pos.x,
                    pos.y
                );

                ctx.stroke();

                ctx.restore();

            }


            /*
             * Фигуры
             */

            if (
                currentTool ===
                "line"
                ||
                currentTool ===
                "rect"
                ||
                currentTool ===
                "ellipse"
            ) {

                restoreSnapshot();

                beginStroke();


                if (
                    currentTool ===
                    "line"
                ) {

                    drawLine(
                        startX,
                        startY,
                        pos.x,
                        pos.y
                    );

                }


                if (
                    currentTool ===
                    "rect"
                ) {

                    drawRect(
                        startX,
                        startY,
                        pos.x,
                        pos.y
                    );

                }


                if (
                    currentTool ===
                    "ellipse"
                ) {

                    drawEllipse(
                        startX,
                        startY,
                        pos.x,
                        pos.y
                    );

                }

            }


            lastX =
                pos.x;

            lastY =
                pos.y;

            event.preventDefault();

        },
        true
    );


    /*
     * ----------------------------------------------------------
     * POINTER UP
     * ----------------------------------------------------------
     */

    canvas.addEventListener(
        "pointerup",
        event => {

            if (!drawing)
                return;


            drawing =
                false;


            /*
             * Ожидаем API основного редактора
             */

            try {

                api.canvas.saveState();

            }
            catch (_) {}


            try {

                api.storage.save();

            }
            catch (_) {}


            try {

                canvas.releasePointerCapture(
                    event.pointerId
                );

            }
            catch (_) {}


            event.preventDefault();

        },
        true
    );


    /*
     * ----------------------------------------------------------
     * ПИПЕТКА
     * ----------------------------------------------------------
     */

    canvas.addEventListener(
        "pointerdown",
        event => {

            if (
                currentTool !==
                "picker"
            ) {

                return;

            }


            const pos =
                getPosition(
                    event
                );


            const pixel =
                ctx.getImageData(
                    Math.floor(pos.x),
                    Math.floor(pos.y),
                    1,
                    1
                ).data;


            const color =
                "#" +
                pixel[0]
                    .toString(16)
                    .padStart(2, "0")
                +
                pixel[1]
                    .toString(16)
                    .padStart(2, "0")
                +
                pixel[2]
                    .toString(16)
                    .padStart(2, "0");


            try {

                api.brush.setColor(
                    color
                );

            }
            catch (_) {}


            selectTool(
                "pencil"
            );

            event.preventDefault();

        },
        true
    );


    /*
     * ----------------------------------------------------------
     * ZOOM
     * CTRL + КОЛЕСО
     * ----------------------------------------------------------
     */

    let zoom =
        1;


    /*
     * Создаём viewport вокруг canvas.
     */

    let viewport =
        document.getElementById(
            "np-zoom-viewport"
        );


    if (!viewport) {

        viewport =
            document.createElement(
                "div"
            );

        viewport.id =
            "np-zoom-viewport";


        const parent =
            canvas.parentElement;


        if (parent) {

            parent.insertBefore(
                viewport,
                canvas
            );

            viewport.appendChild(
                canvas
            );

            viewport.style.display =
                "inline-block";

        }

    }


    function updateZoom() {

        zoomValue.textContent =
            `${Math.round(zoom * 100)}%`;


        viewport.style.transform =
            `scale(${zoom})`;

    }


    function setZoom(
        value
    ) {

        zoom =
            Math.max(
                0.25,
                Math.min(
                    4,
                    value
                )
            );


        updateZoom();

    }


    zoomIn.addEventListener(
        "click",
        () => {

            setZoom(
                zoom + 0.25
            );

        }
    );


    zoomOut.addEventListener(
        "click",
        () => {

            setZoom(
                zoom - 0.25
            );

        }
    );


    zoomReset.addEventListener(
        "click",
        () => {

            setZoom(
                1
            );

        }
    );


    /*
     * Главная фича:
     * CTRL + колесо мыши
     */

    document.addEventListener(
        "wheel",
        event => {

            if (
                !event.ctrlKey
            ) {

                return;

            }


            /*
             * Проверяем,
             * что курсор находится
             * над canvas.
             */

            const rect =
                canvas.getBoundingClientRect();


            const inside =
                event.clientX >= rect.left &&
                event.clientX <= rect.right &&
                event.clientY >= rect.top &&
                event.clientY <= rect.bottom;


            if (!inside)
                return;


            event.preventDefault();


            const delta =
                event.deltaY < 0
                    ? 0.1
                    : -0.1;


            setZoom(
                zoom + delta
            );

        },
        {
            passive: false
        }
    );


    /*
     * ----------------------------------------------------------
     * ГОРЯЧИЕ КЛАВИШИ
     * ----------------------------------------------------------
     */

    document.addEventListener(
        "keydown",
        event => {

            /*
             * Не перехватываем ввод текста.
             */

            const target =
                event.target;

            if (
                target.tagName ===
                "INPUT"
                ||
                target.tagName ===
                "TEXTAREA"
            ) {

                return;

            }


            switch (
                event.key.toLowerCase()
            ) {

                case "p":
                    selectTool("pencil");
                    break;

                case "b":
                    selectTool("brush");
                    break;

                case "e":
                    selectTool("eraser");
                    break;

                case "l":
                    selectTool("line");
                    break;

                case "r":
                    selectTool("rect");
                    break;

                case "o":
                    selectTool("ellipse");
                    break;

                case "i":
                    selectTool("picker");
                    break;

            }

        }
    );


    /*
     * ----------------------------------------------------------
     * СТАРТ
     * ----------------------------------------------------------
     */

    selectTool(
        "pencil"
    );

    updateZoom();


    console.log(
        "[Pro Tools] ✓ Инструменты загружены"
    );

})();
</script>
