<style>
/* ============================================================
   PAINT DARK THEME
   Тёмная тема в стиле Microsoft Paint

.sidebar,

.tools-panel,
.tool-panel {

button,

    background:
        linear-gradient(
            180deg,
            #303030 0%,

.tool-button:active,
.action-button:active {
    transform:
        translateY(1px);
}

button.active,

.tool-button.selected,

    background:
        linear-gradient(
            180deg,
            #4a4a4a 0%,

        ) !important;

<script>
(() => {

    console.log("[Paint Dark] Загружена");

    /*
     * Небольшая кнопка для быстрого включения/выключения темы.
     */

    const button = document.createElement("button");

    button.id = "paint-dark-toggle";

    button.textContent = "☾";

    button.title =
        "Переключить тёмную тему";

    button.style.position =
        "fixed";

    button.style.right =
        "18px";

    button.style.bottom =
        "18px";

    button.style.width =
        "42px";

    button.style.height =
        "42px";

    button.style.borderRadius =
        "10px";

    button.style.zIndex =
        "999999";

    button.style.fontSize =
        "20px";

    document.body.appendChild(button);

    let enabled = true;

    button.addEventListener(
        "click",
        () => {

            enabled = !enabled;

            document.documentElement
                .classList.toggle(
                    "np-light-mode",
                    !enabled
                );

            button.textContent =
                enabled ? "☾" : "☀";

        }
    );

})();
</script>
