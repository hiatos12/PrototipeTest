<script>

(function() {


/* =========================================================
   PLUGIN INFO
========================================================= */


const plugin = {

    id: "shortcuts",

    name: "Keyboard Shortcuts",

    version: "1.0.0"

};


console.log(
    "[Plugin]",
    plugin.name,
    plugin.version
);


/* =========================================================
   DEFAULT SHORTCUTS
========================================================= */


const DEFAULTS = {

    brush: "B",

    eraser: "E",

    line: "L",

    rectangle: "R",

    circle: "O",

    undo: "CTRL+Z",

    redo: "CTRL+Y",

    save: "CTRL+S",

    download: "CTRL+SHIFT+S",

    clear: "DELETE",

    newCanvas: "CTRL+N",

    shortcuts: "CTRL+/"

};


/* =========================================================
   ACTION NAMES
========================================================= */


const ACTIONS = {

    brush: "Кисть",

    eraser: "Ластик",

    line: "Линия",

    rectangle: "Прямоугольник",

    circle: "Круг",

    undo: "Отменить",

    redo: "Повторить",

    save: "Сохранить",

    download: "Скачать PNG",

    clear: "Очистить холст",

    newCanvas: "Новый лист",

    shortcuts: "Показать горячие клавиши"

};


/* =========================================================
   LOAD SETTINGS
========================================================= */


let shortcuts;


try {

    const saved =
        localStorage.getItem(
            "notepaint_shortcuts"
        );


    shortcuts =
        saved
            ? {
                ...DEFAULTS,
                ...JSON.parse(saved)
            }
            : {
                ...DEFAULTS
            };

}
catch {

    shortcuts = {
        ...DEFAULTS
    };

}


/* =========================================================
   UI
========================================================= */


const panel =
    document.getElementById(
        "plugin-shortcuts-panel"
    );


const openButton =
    document.getElementById(
        "shortcuts-open-button"
    );


const closeButton =
    document.getElementById(
        "shortcuts-close"
    );


const list =
    document.getElementById(
        "shortcut-list"
    );


openButton.addEventListener(
    "click",
    () => {

        panel.classList.toggle(
            "show"
        );

    }
);


closeButton.addEventListener(
    "click",
    () => {

        panel.classList.remove(
            "show"
        );

    }
);


/* =========================================================
   RENDER
========================================================= */


function render() {

    list.innerHTML = "";


    for (
        const action
        in ACTIONS
    ) {


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "shortcut-row";


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "shortcut-name";


        name.textContent =
            ACTIONS[action];


        const input =
            document.createElement(
                "input"
            );


        input.className =
            "shortcut-input";


        input.value =
            shortcuts[action] || "";


        input.placeholder =
            "Не назначено";


        input.dataset.action =
            action;


        input.addEventListener(
            "keydown",
            event => {

                event.preventDefault();

                event.stopPropagation();


                const combination =
                    getCombination(
                        event
                    );


                if (!combination) {
                    return;
                }


                input.value =
                    combination;


                shortcuts[action] =
                    combination;

            }
        );


        input.addEventListener(
            "focus",
            () => {

                input.select();

            }
        );


        const remove =
            document.createElement(
                "button"
            );


        remove.className =
            "shortcut-delete";


        remove.textContent =
            "×";


        remove.title =
            "Удалить комбинацию";


        remove.addEventListener(
            "click",
            () => {

                input.value = "";

                shortcuts[action] = "";

            }
        );


        row.appendChild(
            name
        );


        row.appendChild(
            input
        );


        row.appendChild(
            remove
        );


        list.appendChild(
            row
        );

    }

}


/* =========================================================
   KEY COMBINATION
========================================================= */


function getCombination(event) {

    const keys = [];


    if (event.ctrlKey) {
        keys.push("CTRL");
    }


    if (event.altKey) {
        keys.push("ALT");
    }


    if (event.shiftKey) {
        keys.push("SHIFT");
    }


    if (event.metaKey) {
        keys.push("META");
    }


    let key =
        event.key;


    if (
        key === "Control" ||
        key === "Shift" ||
        key === "Alt" ||
        key === "Meta"
    ) {

        return null;

    }


    if (key === " ") {
        key = "SPACE";
    }


    if (key === "Escape") {
        key = "ESC";
    }


    if (key === "ArrowUp") {
        key = "UP";
    }


    if (key === "ArrowDown") {
        key = "DOWN";
    }


    if (key === "ArrowLeft") {
        key = "LEFT";
    }


    if (key === "ArrowRight") {
        key = "RIGHT";
    }


    if (key === "Delete") {
        key = "DELETE";
    }


    if (key === "Backspace") {
        key = "BACKSPACE";
    }


    keys.push(
        key.toUpperCase()
    );


    return keys.join("+");

}


/* =========================================================
   NORMALIZE EVENT
========================================================= */


function eventToCombination(event) {

    const keys = [];


    if (event.ctrlKey) {
        keys.push("CTRL");
    }


    if (event.altKey) {
        keys.push("ALT");
    }


    if (event.shiftKey) {
        keys.push("SHIFT");
    }


    if (event.metaKey) {
        keys.push("META");
    }


    let key =
        event.key;


    if (key === " ") {
        key = "SPACE";
    }


    if (key === "Escape") {
        key = "ESC";
    }


    if (key === "Delete") {
        key = "DELETE";
    }


    if (key === "Backspace") {
        key = "BACKSPACE";
    }


    if (key === "ArrowUp") {
        key = "UP";
    }


    if (key === "ArrowDown") {
        key = "DOWN";
    }


    if (key === "ArrowLeft") {
        key = "LEFT";
    }


    if (key === "ArrowRight") {
        key = "RIGHT";
    }


    keys.push(
        key.toUpperCase()
    );


    return keys.join("+");

}


/* =========================================================
   EXECUTE ACTION
========================================================= */


function executeAction(action) {

    switch (action) {


        case "brush":

            NotePaint.tools.select(
                "brush"
            );

            break;


        case "eraser":

            NotePaint.tools.select(
                "eraser"
            );

            break;


        case "line":

            NotePaint.tools.select(
                "line"
            );

            break;


        case "rectangle":

            NotePaint.tools.select(
                "rectangle"
            );

            break;


        case "circle":

            NotePaint.tools.select(
                "circle"
            );

            break;


        case "undo":

            NotePaint.canvas.undo();

            break;


        case "redo":

            NotePaint.canvas.redo();

            break;


        case "save":

            NotePaint.storage.save();

            break;


        case "download":

            NotePaint.canvas.download();

            break;


        case "clear":

            document
                .getElementById("clear")
                .click();

            break;


        case "newCanvas":

            document
                .getElementById("newCanvas")
                .click();

            break;


        case "shortcuts":

            panel.classList.toggle(
                "show"
            );

            break;

    }

}


/* =========================================================
   KEYBOARD LISTENER
========================================================= */


window.addEventListener(
    "keydown",
    event => {


        /*
         * Если пользователь сейчас
         * редактирует поле комбинации —
         * не запускаем действия.
         */

        if (
            event.target &&
            event.target.classList &&
            event.target.classList.contains(
                "shortcut-input"
            )
        ) {

            return;

        }


        const pressed =
            eventToCombination(
                event
            );


        for (
            const action
            in shortcuts
        ) {


            const assigned =
                shortcuts[action];


            if (!assigned) {
                continue;
            }


            if (
                assigned === pressed
            ) {

                event.preventDefault();

                event.stopPropagation();


                executeAction(
                    action
                );


                return;

            }

        }

    },
    true
);


/* =========================================================
   SAVE SETTINGS
========================================================= */


document
    .getElementById(
        "shortcuts-save"
    )
    .addEventListener(
        "click",
        () => {

            localStorage.setItem(
                "notepaint_shortcuts",
                JSON.stringify(
                    shortcuts
                )
            );

            panel.classList.remove(
                "show"
            );

        }
    );


/* =========================================================
   RESET
========================================================= */


document
    .getElementById(
        "shortcuts-reset"
    )
    .addEventListener(
        "click",
        () => {

            shortcuts = {
                ...DEFAULTS
            };


            localStorage.setItem(
                "notepaint_shortcuts",
                JSON.stringify(
                    shortcuts
                )
            );


            render();

        }
    );


/* =========================================================
   START
========================================================= */


render();


})();

</script>
